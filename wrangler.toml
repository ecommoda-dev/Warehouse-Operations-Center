name               = "warehouse-operations-center-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true



[observability]
enabled = true


# ─────────────────────────────────────────────────────────────
# 🔴 الريبو ده فيه **النُصّين**: الواجهة على GitHub Pages، والـ Worker هنا.
#    ده الشكل القياسي (قرار ٨ في `ecommoda-tool-migration-playbook`:
#    أداة = Worker واحد + HTML واحد + ريبو واحد) — نفس شكل
#    `Delivery-COD-Operations-Center`.
#
# 🔴 **وعشان كده `Build watch paths` إلزامية — وغلطتها قاتلة وصامتة:**
#      Include paths : index.js        ← chip منفصل
#                      wrangler.toml   ← chip منفصل
#      Exclude paths : (فاضي)
#    ⛔ الحقل chips مش نص: لو الاتنين اتكتبوا في سطر واحد بمسافة، بيتسجّلوا
#       **chip واحد** باسم مش موجود، والنتيجة **مفيش أي push هيبني تاني —
#       ولا خطأ ولا رسالة ولا أثر، والـ Worker بيتجمّد على نسخته للأبد**.
#    ⚠️ من غير التضييق، **كل تعديل في أي صفحة من صفحات الهب بينشر الـ Worker
#       تاني** بنفس الكود — ضوضاء في Version History وبناءات متحرقة.
#    ⚠️ والتحقق **في الاتجاهين**: تعديل HTML مايبنيش من `main`، وتعديل
#       `index.js` يبني. الاتجاه الواحد شكله زي «الـ paths باظت» بالظبط.
#    ⚠️ وأي ملف جديد يعتمد عليه الـ Worker لازم يتضاف للـ paths، وإلا يفضل
#       على نسخة قديمة **بلا أي رسالة**.
#    (`ecommoda-tool-migration-playbook` §13-ب)
# ─────────────────────────────────────────────────────────────

[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ─────────────────────────────────────────────────────────────
# [vars]
# ─────────────────────────────────────────────────────────────
# 🔴 **مفيش [vars] — والغياب مقصود.** الـ Worker ده **دخول وخروج بس**:
#    مالوش أي نداء لشوبيفاي، فمفيش `SHOP_DOMAIN`. var مش مستخدم = كود ميت.
# ─────────────────────────────────────────────────────────────
# الأسرار — Dashboard → Settings → Variables and Secrets → علّم "Secret"
# ممنوع تتكتب في الريبو. اكتب الأسماء، متلزقش القيم.
# ⚠️ بعد إضافة أي سر → Deployments → Version History → ⋯ → **Promote**
#    من غير Promote القيمة بتفضل undefined → كل نداء Unauthorized.
# ─────────────────────────────────────────────────────────────
# WORKER_SECRET   ← 🔴 **قيمة مجموعة `warehouse_ops`** — نفس القيمة بالحرف
#                    على باقي الثمانية Workers (الطباعة · التغليف · حذف
#                    منتج · باركود SKU · سكانرا بوسطة · تسليمات المكتب ·
#                    استلام المرتجعات). قيمة مختلفة = 401 من الـ Worker ده
#                    بس، والشاشة بتفتح عادي وأول نداء دخول بيقع.
#                    ⚠️ والانضمام للمجموعة **لازم يتسجّل** في
#                    `ecommoda-constants` → `references/secret-groups.md`
#                    (قاعدة ٢) — عضو غير مسجّل = التدوير بيتكسر بصمت.
#
# ⛔ **وممنوع `CLIENT_ID`/`CLIENT_SECRET` هنا** — الـ Worker ده مالوش أي نداء
#    لشوبيفاي بقرار: سطح الـ PIN ومفاتيح المتجر في Workers مختلفة.
# ─────────────────────────────────────────────────────────────
